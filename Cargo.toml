# Its own workspace root, so this repository builds on its own.
#
# Every module repository carries this and the template did not, which stopped
# mattering the moment the template stopped sitting beside the estate: nested at
# template/rust, cargo walked up, found the root workspace and refused to build.
#
# It would have bitten a generated repository the same way. A template that does
# not obey the estate's rules produces repositories that start out breaking
# them — doc/governance/rust-style.md section 4.
[workspace]

[package]
name = "xmip-core-authenticate-certificate"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-authenticate-certificate"
description = "Authenticate by certificate: verifies a certificate chain to a configured trust anchor, validity and revocation as ADR-0033 says."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The gate's own trait, with its x509 module turned on: the chain walk,
# the names and the revocation lists are the capability's (ADR-0044).
# context for Verified, xcore for the mechanism.
authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main", features = ["x509"] }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[features]
# Hybrid certificates (ITU-T X.509 (10/2019) clause 9.8): the ML-DSA
# alternative signature is verified along the proved path, under the
# Hybrid policy the node states. Its own feature, so a package is
# quantum-ready or not; off, the extensions are not looked at.
hybrid = ["authenticate/x509-alt"]

[dev-dependencies]
# The tests mint their own chains; `mint` ships in no build. The crate tests
# its hybrid path through a dev-dependency on itself with the feature on.
authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main", features = ["mint"] }
xmip-core-authenticate-certificate = { path = ".", features = ["hybrid"] }

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
